services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bootcamp}:${POSTGRES_PASSWORD:-bootcamp}@db:5432/${POSTGRES_DB:-bootcamp}
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      ADMIN_DOCUMENT_NUMBER: ${ADMIN_DOCUMENT_NUMBER:?Defina ADMIN_DOCUMENT_NUMBER no .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Defina ADMIN_INITIAL_PASSWORD no .env}
      ACCOUNT_DOCUMENT_NUMBER: ${ACCOUNT_DOCUMENT_NUMBER:?Defina ACCOUNT_DOCUMENT_NUMBER no .env}
      ACCOUNT_PASSWORD: ${ACCOUNT_PASSWORD:?Defina ACCOUNT_PASSWORD no .env}
      REVENUE_ACCOUNT_KEY: ${REVENUE_ACCOUNT_KEY:?Defina REVENUE_ACCOUNT_KEY no .env}

      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      KYC_API_URL: ${KYC_API_URL:-http://mock-server:8080}
      ANTIFRAUD_API_URL: ${ANTIFRAUD_API_URL:-http://mock-server:8080}
      RISK_API_URL: ${RISK_API_URL:-http://mock-server:8080}
      API_TIMEOUT: ${API_TIMEOUT:-5}
      BANKSLIP_API_URL: ${BANKSLIP_API_URL:-http://mock-server:8080}
      BANKSLIP_API_INTERNAL_TOKEN: ${BANKSLIP_API_INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_TIMEOUT: ${BANKSLIP_API_TIMEOUT:-5}
    volumes:
      - ./src:/app
    command: ["/bin/sh", "-c", "python seed.py && python seed_revenue_account.py && exec uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mock-server:
        condition: service_healthy

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bootcamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bootcamp}
      POSTGRES_DB: ${POSTGRES_DB:-bootcamp}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bootcamp} -d ${POSTGRES_DB:-bootcamp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-server:
    image: wiremock/wiremock:latest
    ports:
      - "${MOCK_PORT:-8080}:8080"
    volumes:
      - ./mocks:/home/wiremock
    command: 
      ["--global-response-templating"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/mappings > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s